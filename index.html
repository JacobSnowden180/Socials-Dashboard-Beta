<style>
  :root {
    --bg: #e7f4ef;
    --ink: #12261f;
    --muted: #5c726a;
    --line: #d7ebe3;
    --card: #ffffff;
    --mint: #0f9d72;
    --mint-deep: #0c7a58;
    --mint-soft: #e5f8f1;
    --blue: #1a6fd4;
    --blue-deep: #1558b0;
    --blue-soft: #e7f1ff;
    --shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 10px 28px rgba(16, 72, 56, .07);
    --radius: 14px;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, monospace;
    --rainbow: linear-gradient(90deg, #ff4d6d, #ff8a3d, #f0a202, #1fbe7a, #1a9bf0, #7a5cff, #ff4fa3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--sans);
    background-color: var(--bg);
    background-image:
      radial-gradient(1100px 520px at 112% -12%, rgba(26, 111, 212, .18), transparent 56%),
      radial-gradient(900px 480px at -12% -18%, rgba(15, 157, 114, .22), transparent 52%),
      radial-gradient(420px 260px at 78% 0%, rgba(255, 79, 163, .08), transparent 70%),
      radial-gradient(circle, rgba(18, 70, 55, .045) 1px, transparent 1px);
    background-size: auto, auto, auto, 20px 20px;
    letter-spacing: -0.011em;
  }
  .rainbow {
    position: sticky;
    top: 0;
    z-index: 20;
    height: 4px;
    background: var(--rainbow);
  }
  .page { max-width: 1440px; margin: 0 auto; padding: 14px 16px 32px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: 22px; line-height: 1.1; letter-spacing: -0.03em; }
  h2 { font-size: 15px; letter-spacing: -0.02em; }
  .deck { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 3px; max-width: 62ch; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
  .up { color: var(--mint-deep); }
  .down { color: #c43838; }

  .mast {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(15, 90, 70, .1);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 14px;
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .logo {
    width: 44px; height: 44px; flex: none; border-radius: 12px;
    background: linear-gradient(155deg, #14b888 0%, #1a6fd4 100%);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px;
    align-items: end; padding: 9px 8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .logo span { display: block; background: #fff; border-radius: 2px; }
  .logo span:nth-child(1) { height: 38%; }
  .logo span:nth-child(2) { height: 70%; }
  .logo span:nth-child(3) { height: 100%; }
  .logo span:nth-child(4) { height: 52%; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--mint-deep);
    margin-bottom: 2px;
  }
  .sub { color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 3px; }
  .mast-meta { display: flex; align-items: stretch; gap: 8px; flex: none; }
  .chip, .stamp, .clockbox {
    background: var(--mint-soft);
    border: 1px solid #cfeade;
    border-radius: 10px;
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 0;
  }
  .chip {
    background: #fff;
    border: 1px dashed #8fd0b8;
    color: var(--mint-deep);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    align-items: center;
    flex-direction: row;
    gap: 8px;
  }
  .chip b {
    width: 8px; height: 8px; border-radius: 99px;
    background: var(--rainbow);
    display: block;
  }
  .k {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stamp strong, .clockbox strong { font-size: 14px; font-weight: 650; }
  .clockbox { background: var(--blue-soft); border-color: #d3e4fb; min-width: 132px; }
  .clockbox strong { font-size: 20px; color: var(--blue-deep); }
  .pulse {
    width: 7px; height: 7px; border-radius: 99px; background: var(--mint);
    box-shadow: 0 0 0 0 rgba(15, 157, 114, .55);
    animation: pulse 1.8s ease-out infinite;
    display: inline-block;
  }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 7px rgba(15, 157, 114, 0); }
  }

  .ticker {
    margin-top: 10px;
    background: #fff;
    border: 1px solid rgba(15, 90, 70, .1);
    border-radius: 999px;
    overflow: hidden;
    height: 32px;
    display: flex;
    align-items: center;
    box-shadow: var(--shadow);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .ticker-track {
    display: flex;
    gap: 22px;
    width: max-content;
    animation: marquee 80s linear infinite;
    padding-left: 16px;
  }
  .ticker span {
    font-family: var(--mono);
    font-size: 11px;
    color: #3e5c54;
    white-space: nowrap;
  }
  .ticker i {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 99px;
    margin-right: 8px;
    transform: translateY(-1px);
  }
  @keyframes marquee { to { transform: translateX(-50%); } }

  .row { display: grid; gap: 10px; margin-top: 10px; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .sparks { grid-template-columns: repeat(5, 1fr); }

    border: 1px solid rgba(15, 90, 70, .1);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 12px 12px;

  }
  .card:before, .card:after {

  .card:before { top: 5px; left: 5px; border-width: 1.5px 0 0 1.5px; }
  .card:after { right: 5px; bottom: 5px; border-width: 0 1.5px 1.5px 0; }
  .kpi { border-top: 3px solid var(--accent); padding-top: 10px; }
  .kpi:nth-child(1) { --accent: #ff4d6d; }
  .kpi:nth-child(2) { --accent: #1a6fd4; }
  .kpi:nth-child(3) { --accent: #f0a202; }
  .kpi:nth-child(4) { --accent: #0f9d72; }
  .kpi .k { margin-bottom: 6px; }
  .kpi .big { font-size: 28px; line-height: 1; color: var(--ink); }
  .kpi .sub { min-height: 2.6em; }
  .kpi .up { color: var(--mint-deep); }
  .sparkcard { border-top: 3px solid var(--brand); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .sparkhead, .meter, .legend, .frow, .conn-top, .sc-top, .rx-top, .sess-top {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .sparkhead .who, .meter .who, .frow .who { min-width: 0; }
  .name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aka { color: var(--muted); font-weight: 500; font-size: 11px; }
  .spark-metric { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .spark-metric .big { font-size: 22px; line-height: 1; }
  .sparkline { width: 100%; height: 38px; display: block; }
  .sparkline.f-spark { width: 100%; height: 26px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
  .kicker {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--blue-deep);
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 3px;
  }
  .kicker i, .dot {
    width: 7px; height: 7px; border-radius: 99px; background: var(--c, var(--mint)); display: inline-block; flex: none;
  }
  .mark { display: block; flex: none; }

  .vol-plot { display: grid; grid-template-columns: 16px 1fr; gap: 6px; height: 168px; }
  .yaxis {
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right;
  }
  .bars {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 100%;
    border-bottom: 1px solid var(--line);
    background-image: repeating-linear-gradient(to top, transparent, transparent calc(25% - 1px), #e7f3ee calc(25% - 1px), #e7f3ee 25%);
  }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 100%; }
  .bar {
    flex: 1; border-radius: 2px 2px 0 0; min-width: 0;
    background: var(--fill);
  }
  .bar.zero { height: 2px !important; opacity: .35; }
  .vol-labs { display: grid; grid-template-columns: 16px 1fr; gap: 6px; margin-top: 4px; }
  .vol-labs .labs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .vol-labs span { text-align: center; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .legend { flex-wrap: wrap; gap: 8px 12px; margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: #244239; }
  .daystrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
  .daystrip div {
    background: #f4fbf8; border: 1px solid var(--line); border-radius: 8px; padding: 5px 4px 4px; text-align: center; min-width: 0;
  }
  .daystrip strong { display: block; font-size: 11px; }

  .daystrip .dlbl { color: var(--blue-deep); letter-spacing: .03em; }
  .callout {
    margin-top: 8px; font-size: 12px; color: #244239;
    background: linear-gradient(90deg, #e7f1ff, #e5f8f1);
    border-radius: 8px; padding: 6px 8px;
  }

  .er-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .er-top .big { font-size: 40px; line-height: .9; color: var(--blue-deep); }
  .formula { font-size: 11px; color: var(--muted); line-height: 1.35; margin: 6px 0 8px; }
  .meter { display: grid; grid-template-columns: 92px 1fr 58px; gap: 6px; margin-top: 5px; }
  .meter .who { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; }
  .track { height: 8px; background: #e7f3ee; border-radius: 99px; overflow: hidden; }
  .track span { display: block; height: 100%; border-radius: 99px; }
  .meter .val { font-family: var(--mono); font-size: 11px; text-align: right; }
  .share {
    display: flex; height: 12px; width: 100%; border-radius: 99px; overflow: hidden; margin-top: 10px;
    box-shadow: inset 0 0 0 1px rgba(18,38,31,.06);
  }
  .share i { display: block; height: 100%; }
  .share-key { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
  .share-key span { font-size: 11px; color: #244239; display: inline-flex; align-items: center; gap: 4px; }
  .pair, .rxsum { display: grid; gap: 6px; margin-top: 10px; }
  .pair { grid-template-columns: 1fr 1fr; }
  .rxsum { grid-template-columns: repeat(3, 1fr); }
  .pair div, .rxsum div { background: #f4fbf8; border-radius: 8px; padding: 6px 8px; border: 1px solid var(--line); min-width: 0; }
  .pair strong, .rxsum strong { display: block; font-size: 14px; }
  .pair span, .rxsum span { font-size: 10px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-family: var(--mono); }

  .top-row {
    display: grid;
    grid-template-columns: 20px 18px 1fr auto;
    gap: 7px;
    align-items: center;
    padding: 6px 0;
    border-top: 1px solid #e8f4ef;
  }
  .rank {
    width: 20px; height: 20px; border-radius: 6px;
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 10px; font-weight: 700;
  }
  .top-title { font-size: 12.5px; font-weight: 700; line-height: 1.3; }
  .clamp2, .clamp3 {
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }
  .clamp2 { -webkit-line-clamp: 2; line-clamp: 2; }
  .clamp3 { -webkit-line-clamp: 3; line-clamp: 3; }
  .top-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .top-stat { text-align: right; }
  .top-stat b { display: block; font-size: 12px; }
  .top-stat span { font-family: var(--mono); font-size: 10px; color: var(--blue-deep); }
  .vbar { height: 3px; background: #e7f3ee; border-radius: 99px; margin-top: 4px; }
  .vbar span { display: block; height: 100%; border-radius: 99px; background: var(--c); }
  .bestline {
    margin-top: 8px; font-size: 12px; padding: 6px 8px; border-radius: 8px;
    background: #fff7e8; color: #6a4a08; border: 1px solid #f3e2b8;
  }

  .queue { border-top: 3px solid transparent; background:
    linear-gradient(#fff, #fff) padding-box,
    var(--rainbow) border-box;
  }
  .qstats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
    border-radius: 999px; padding: 4px 7px; border: 1px solid transparent; white-space: nowrap;
  }
  .pill.ready { background: var(--mint-soft); color: var(--mint-deep); }
  .pill.queued { background: var(--blue-soft); color: var(--blue-deep); }
  .pill.cutting { background: #fff1e4; color: #b85a00; }
  .slots { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; margin: 2px 0 10px; }
  .slots i { display: block; height: 8px; border-radius: 99px; background: #e5f3ee; }
  .slots i.on { background: var(--c); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .scard {
    border: 1px solid rgba(15, 90, 70, .1);
    border-left: 3px solid var(--brand);
    border-radius: 12px;
    padding: 10px 10px 10px 12px;
    background: linear-gradient(180deg, #fff, #f8fdfb);
    display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 176px;
  }
  .sc-top { justify-content: space-between; }
  .sc-id { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; font-weight: 750; }
  .when { font-family: var(--mono); font-size: 11px; color: var(--blue-deep); }
  .caption { font-size: 13px; font-weight: 700; line-height: 1.35; letter-spacing: -0.015em; }
  .about { color: #3d5b53; font-size: 12px; line-height: 1.4; }
  .sc-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;

  }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }

  .step b { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .step span { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; margin-top: 3px; }
  .n {
    width: 16px; height: 16px; border-radius: 99px; display: grid; place-items: center;
    color: #fff; font-family: var(--mono); font-size: 10px; background: var(--c);
  }
  .eq { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 8px; }
  .eq .big { font-size: 26px; }
  .eq em { font-style: normal; color: var(--muted); font-size: 12px; }
  .sess { padding-top: 8px; margin-top: 8px; border-top: 1px solid #e8f4ef; }

  .sess-top strong { font-size: 12.5px; }
  .sess p { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .pchip {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 2px 6px 2px 3px;
    background: #fff; border: 1px solid var(--line); font-size: 10.5px;
  }

  .heat { display: grid; grid-template-columns: 28px repeat(12, 1fr); gap: 3px; align-items: center; }

  .heat .h.row { text-align: right; padding-right: 2px; }
  .heat i { display: block; height: 18px; border-radius: 3px; }
  .heat-key { display: flex; align-items: center; gap: 4px; margin-top: 8px; color: var(--muted); font-size: 11px; }

  .frow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid #e8f4ef; }
  .fmain { min-width: 0; }
  .fsub { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .fgain { height: 4px; background: #e7f3ee; border-radius: 99px; margin-top: 4px; }
  .fgain span { display: block; height: 100%; border-radius: 99px; background: var(--brand); }

  .fnum b { display: block; font-size: 13px; }

  .fmt-bar { height: 16px; margin: 4px 0 8px; }
  .fmt-bar i, .rx-bar i { display: block; height: 100%; }
  .fmt-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-bottom: 8px; }
  .fmt-legend span, .pkey { display: flex; align-items: center; gap: 5px; font-size: 11.5px; min-width: 0; }
  .pkey { justify-content: space-between; }
  .pkey .l { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .platbar { display: grid; grid-template-columns: 78px 1fr 22px; gap: 6px; align-items: center; margin-top: 5px; font-size: 11px; }
  .rx { padding: 6px 0; border-top: 1px solid #e8f4ef; }
  .rx-top { justify-content: space-between; font-size: 12px; }
  .rx-nums { display: flex; justify-content: space-between; gap: 6px; margin-top: 4px; color: var(--muted); font-size: 10.5px; }

  .conn .statusline { display: flex; justify-content: space-between; gap: 6px; align-items: center; margin: 8px 0; }
  .ok {
    display: inline-flex; align-items: center; gap: 5px;

  }

    kpi("04 · Next go-live", '<span class="js-count">--:--:--</span>', "Countdown to the next placeholder slot", "Fri 27 Nov · 09:30 UTC") +
  "</section>";
}
function kpi(k, big, sub, foot) {
  return '<article class="card kpi"><div class="k">' + k + '</div><div class="big num">' + big + '</div><p class="sub">' + sub + '</p><p class="sub up">' + foot + "</p></article>";
}
function renderSparks(m) {
  return '<section class="row sparks" aria-label="Seven day engagement sparklines">' + m.platforms.map(function (p) {
    const delta = p.latest - p.erSeries[0];
    return '<article class="card sparkcard" style="--brand:' + p.color + '">' +
      '<div class="sparkhead">' + mark(p.id, 18) +
        '<div class="who"><div class="name">' + esc(p.name) + (p.aka ? ' <span class="aka">' + esc(p.aka) + "</span>" : "") + "</div>" +
        '<div class="aka">Placeholder channel</div></div></div>' +
      '<div class="spark-metric"><div class="big num">' + p.latest.toFixed(1) + '%</div><div class="up num">' + signed(delta, 1) + " pt</div></div>" +
      spark(p.erSeries, p.color) +
      '<div class="meta"><span>Daily rate</span><span>7-day ' + p.rate.toFixed(2) + "%</span></div>" +
      '<div class="meta"><span>' + p.posts + " posts</span><span>" + compact(p.views) + " views</span></div>" +
    "</article>";
  }).join("") + "</section>";
}
function renderVolume(m) {
  const max = 8;
  const bars = m.days.map(function (d, i) {
    const cols = m.platforms.map(function (p) {
      const posts = p.days[i].posts;
      const h = posts === 0 ? 0 : (posts / max) * 100;
      return '<i class="bar' + (posts === 0 ? " zero" : "") + '" style="--fill:' + p.bar + ";height:" + h + '%" title="' + d.short + " " + d.num + " · " + esc(p.name) + " · " + posts + " post" + (posts === 1 ? "" : "s") + '"></i>';
    }).join("");
    return '<div class="cols">' + cols + "</div>";
  }).join("");
  const labs = m.days.map(function (d) { return "<span>" + d.short + "</span>"; }).join("");
  const legend = m.platforms.map(function (p) {
    return "<span>" + mark(p.id, 14) + esc(p.name) + " <b class='num'>" + p.posts + "</b></span>";
  }).join("");
  const strip = m.days.map(function (d) {
    return "<div><span class='dlbl'>" + d.short + "</span><strong>" + d.posts + "</strong><em>" + compact(d.views) + "</em></div>";
  }).join("");
  const maxViews = Math.max.apply(null, m.platforms.map(function (p) { return p.views; }));
  const vrows = m.platforms.map(function (p) {
    return '<div class="meter"><div class="who">' + mark(p.id, 14) + esc(p.name) + '</div><div class="track"><span style="width:' + (p.views / maxViews * 100) + "%;background:" + p.hbar + '"></span></div><div class="val">' + compact(p.views) + "</div></div>";
  }).join("");
  return '<article class="card"><div class="kicker"><i style="--c:#ff4d6d"></i>05 · Volume</div><h2>Post volume per channel</h2><p class="deck">Posts published each day, 20–26 Nov. Five thin bars are the five channels. Residual views still count on days with no new post.</p>' +
    '<div class="vol-plot" style="margin-top:8px"><div class="yaxis"><span>8</span><span>6</span><span>4</span><span>2</span><span>0</span></div><div class="bars">' + bars + "</div></div>" +
    '<div class="vol-labs"><span></span><div class="labs">' + labs + "</div></div>" +
    '<div class="legend">' + legend + "</div>" +
    '<div class="daystrip">' + strip + "</div>" +
    '<div class="callout">Heaviest sample day · ' + m.busiest.short + " " + m.busiest.num + " · " + m.busiest.posts + " posts · " + comma(m.busiest.views) + " views</div>" +
    '<div class="pin-bottom"><div class="k">Views by channel</div>' + vrows + "</div></article>";
}
function renderEr(m) {
  const cap = 12;
  const meters = m.platforms.map(function (p) {
    return '<div class="meter"><div class="who">' + mark(p.id, 14) + esc(p.name) + '</div><div class="track"><span style="width:' + Math.min(100, p.rate / cap * 100) + "%;background:" + p.meter + '"></span></div><div class="val">' + p.rate.toFixed(2) + "%</div></div>";
  }).join("");
  const share = m.platforms.map(function (p) {
    return '<i style="width:' + (p.eng / m.totals.eng * 100) + "%;background:" + p.hbar + '" title="' + esc(p.name) + " " + comma(p.eng) + ' engagements"></i>';
  }).join("");
  const blend = m.days.map(function (d) {
    return "<div><span class='dlbl'>" + d.short + "</span><strong>" + d.rate.toFixed(1) + "%</strong><em>" + compact(d.eng) + "</em></div>";
  }).join("");
  const key = m.platforms.map(function (p) {
    return '<span><i class="dot" style="--c:' + p.color + '"></i>' + esc(p.name) + " " + Math.round(p.eng / m.totals.eng * 100) + "%</span>";
  }).join("");
  const delta = m.totals.rate - DATA.prior.rate;
  return '<article class="card"><div class="kicker"><i style="--c:#1a6fd4"></i>06 · Rate</div><h2>Engagement rate</h2>' +
    '<div class="er-top"><div class="big num">' + m.totals.rate.toFixed(2) + '%</div><div class="up num">' + signed(delta, 2) + " pt</div></div>" +
    '<p class="formula">7-day blend across all five placeholders. Rate = (likes + comments + shares) ÷ views. Meters run on a 0–12% scale. Prior sample week was ' + DATA.prior.rate.toFixed(2) + "%.</p>" +
    meters +
    '<div class="pair"><div><span>Engagements</span><strong class="num">' + comma(m.totals.eng) + '</strong></div><div><span>Views</span><strong class="num">' + comma(m.totals.views) + "</strong></div></div>" +
    '<div class="share" aria-hidden="true">' + share + '</div><div class="share-key">' + key + "</div>" +
    '<p class="formula">Share of engagements, not share of posts. TikTok carries most of the reactions in this sample week.</p>' +
    '<div class="pin-bottom"><div class="k">Blended rate by day</div><div class="daystrip">' + blend + "</div>" +
    '<div class="rxsum"><div><span>Likes</span><strong class="num">' + comma(m.totals.likes) + '</strong></div><div><span>Comments</span><strong class="num">' + comma(m.totals.comments) + '</strong></div><div><span>Shares</span><strong class="num">' + comma(m.totals.shares) + "</strong></div></div></div></article>";
}
function renderTop(m) {
  const max = m.top[0].views;
  const rows = m.top.map(function (item, i) {
    const p = m.byId[item.platform];
    const dark = i === 2 || i === 7;
    return '<div class="top-row"><div class="rank" style="background:' + RANK_BG[i] + ";color:" + (dark ? "#12261f" : "#fff") + '">' + (i + 1) + "</div>" +
      mark(item.platform, 16) +
      '<div><div class="top-title clamp2">' + esc(item.title) + '</div><div class="top-meta">' + esc(p.name) + " · " + esc(item.format) + " · " + esc(item.when) + '</div><div class="vbar"><span style="width:' + (item.views / max * 100) + "%;background:" + p.color + '"></span></div></div>' +
      '<div class="top-stat"><b class="num">' + compact(item.views) + '</b><span>' + item.er.toFixed(2) + "%</span></div></div>";
  }).join("");
  const b = m.bestRate;
  return '<article class="card span2"><div class="kicker"><i style="--c:#f0a202"></i>07 · Leaders</div><h2>Top-performing content</h2><p class="deck">Ranked by views in the sample week. The rate beside each row is that post’s own engagements ÷ views.</p>' +
    rows +
    '<div class="bestline">Highest rate this sample · ' + esc(m.byId[b.platform].name) + " · " + b.er.toFixed(2) + "% · " + esc(b.title) + "</div></article>";
}
function renderQueue(m) {
  const pills = '<span class="pill ready">' + m.counts.Ready + ' ready</span><span class="pill queued">' + m.counts.Queued + ' queued</span><span class="pill cutting">' + m.counts.Cutting + " cutting</span>";
  const slots = [];
  DATA.schedule.forEach(function (s) {
    const p = m.byId[s.platform];
    slots.push('<i class="on" style="--c:' + p.color + '" title="' + esc(p.name) + " · " + esc(s.status) + '"></i>');
  });
  for (let i = DATA.schedule.length; i < DATA.capacity; i++) slots.push("<i></i>");
  const cards = DATA.schedule.map(function (s) {
    const p = m.byId[s.platform];
    return '<article class="scard" style="--brand:' + p.color + '"><div class="sc-top"><div class="sc-id">' + mark(s.platform, 16) + esc(p.name) + (p.aka ? " · " + esc(p.aka) : "") + '</div><span class="pill ' + s.status.toLowerCase() + '">' + esc(s.status) + "</span></div>" +
      '<div class="when">' + whenLabel(s.at) + "</div>" +
      '<div class="caption clamp2">“' + esc(s.caption) + "”</div>" +
      '<div class="about clamp3">' + esc(s.about) + "</div>" +
      '<div class="sc-foot"><span class="tag">' + esc(s.format) + '</span><span class="tag">From ' + esc(s.session) + "</span></div></article>";
  }).join("");
  return '<section class="card queue"><div class="card-head"><div><div class="kicker"><i style="--c:#7a5cff"></i>08 · The machine’s output</div><h2>Scheduled content</h2><p class="deck">Austin Chen’s AI Content Machine: one or two hours of the idea, remade into a native version for each platform. This queue is that output. Times, captions, and channels are placeholders.</p></div><div class="qstats">' + pills + '<span class="pill ready">Next <span class="js-count">--:--:--</span></span></div></div>' +
    '<div class="slots" aria-hidden="true">' + slots.join("") + "</div>" +
    '<div class="cards">' + cards + "</div></section>";
}
function renderPipeline(m) {
  const steps = [
    ["#ff4d6d", "Sit", "One or two hours. Say the idea once, on purpose."],
    ["#1a6fd4", "Cut", "Rewrite it in the shape each platform already rewards."],
    ["#0f9d72", "Ship", "The cards above are the cuts, waiting on a placeholder clock."]
  ].map(function (s, i) {
    return '<div class="step"><b><span class="n" style="--c:' + s[0] + '">' + (i + 1) + "</span>" + s[1] + "</b><span>" + s[2] + "</span></div>";
  }).join("");
  const sessions = DATA.sessions.map(function (s) {
    const chips = s.chips.map(function (c) {
      return '<span class="pchip">' + mark(c[0], 12) + esc(c[1]) + "</span>";
    }).join("") + '<span class="tag">+' + s.extra + " more</span>";
    const n = s.chips.length + s.extra;
    return '<div class="sess"><div class="sess-top"><strong class="num">' + s.id + " · " + s.minutes + ' min</strong><span class="tag">' + n + " natives</span></div><p>" + esc(s.title) + "</p><div class=\"chips\">" + chips + "</div></div>";
  }).join("");
  const older = m.totals.posts - m.natives;
  return '<article class="card"><div class="kicker"><i style="--c:#ff4fa3"></i>09 · Source → native</div><h2>What went into the machine</h2><div class="steps">' + steps + "</div>" +
    '<div class="eq"><div class="big num">' + m.minutes + ' min</div><div class="big num">→ ' + m.natives + '</div><em>natives from 3 sample sittings · ' + (m.minutes / m.natives).toFixed(1) + " min of source per cut</em></div>" +
    '<p class="deck">' + older + " other sample posts in the 7-day window are still moving from earlier sittings. " + m.totals.posts + " posts touched this week in all.</p>" +
    sessions + "</article>";
}
function renderHeat() {
  let cells = "<span></span>" + HEAT_HOURS.map(function (h) { return '<span class="h">' + h + "</span>"; }).join("");
  DATA.heat.forEach(function (row, ri) {
    cells += '<span class="h row">' + DAYS[ri].short + "</span>";
    row.forEach(function (lv, ci) {
      cells += '<i style="background:' + HEAT_COLORS[lv] + '" title="' + DAYS[ri].short + " " + HEAT_HOURS[ci] + ":00 UTC · " + HEAT_NAME[lv] + '"></i>';
    });
  });
  const key = HEAT_COLORS.map(function (c, i) { return '<i style="background:' + c + '"></i>' + (i === 0 || i === 5 ? "<span>" + HEAT_NAME[i] + "</span>" : ""); }).join("");
  return '<article class="card"><div class="kicker"><i style="--c:#7a5cff"></i>10 · Rhythm</div><h2>When the machine is busy</h2><p class="deck">Sample intensity by hour, UTC. Publishing, cutting, and caption work share one heat. Not a viewer’s local clock.</p><div class="heat" style="margin-top:8px">' + cells + '</div><div class="heat-key">' + key + "</div>" +
    '<div class="callout">Hottest sample hours · Tue 14:00 and 18:00 UTC · a sitting, then the cuts going out</div></article>';
}
function renderFollowers(m) {
  const maxDelta = Math.max.apply(null, m.platforms.map(function (p) { return p.followerDelta; }));
  const delta = m.totals.followerDelta - DATA.prior.followers;
  const rows = m.platforms.map(function (p) {
    return '<div class="frow"><div class="fmain"><div class="sparkhead">' + mark(p.id, 16) + '<div class="who"><div class="name">' + esc(p.name) + '</div></div></div>' +
      spark(p.followers, p.color, 120, 28).replace("sparkline", "sparkline f-spark") +
      '<div class="fgain"><span style="width:' + (p.followerDelta / maxDelta * 100) + "%;background:" + p.color + '"></span></div></div>' +
      '<div class="fnum"><b class="num">' + comma(p.followerEnd) + '</b><span class="up">' + signed(p.followerDelta) + "</span></div></div>";
  }).join("");
  return '<article class="card"><div class="kicker"><i style="--c:#1fbe7a"></i>11 · Following</div><h2>Follower motion</h2><div class="er-top"><div class="big num">' + signed(m.totals.followerDelta) + '</div><div class="up num">' + signed(delta) + " vs prior</div></div>" +
    '<p class="formula">Net change across the sample week, end minus start. Sparks are scaled to each channel’s own range, so read the number, not the slope, for size.</p>' + rows + "</article>";
}
function renderFormats(m) {
  const entries = Object.keys(FORMATS).map(function (key) {
    return { key: key, n: m.formatTotals[key] || 0, label: FORMATS[key].label, color: FORMATS[key].color };
  }).filter(function (e) { return e.n > 0; }).sort(function (a, b) { return b.n - a.n; });
  const bar = entries.map(function (e) {
    return '<i style="width:' + (e.n / m.totals.posts * 100) + "%;background:" + e.color + '" title="' + e.label + " " + e.n + '"></i>';
  }).join("");
  const legend = entries.map(function (e) {
    return '<span><i class="dot" style="--c:' + e.color + '"></i>' + e.label + " <b class='num'>" + e.n + "</b></span>";
  }).join("");
  const rows = m.platforms.map(function (p) {
    const segs = p.parts.map(function (part) {
      return '<i style="width:' + (part[1] / p.posts * 100) + "%;background:" + FORMATS[part[0]].color + '" title="' + FORMATS[part[0]].label + " " + part[1] + '"></i>';
    }).join("");
    return '<div class="platbar"><div class="who" style="display:flex;align-items:center;gap:4px">' + mark(p.id, 14) + esc(p.name) + '</div><div class="fmt-bar" style="height:10px;margin:0">' + segs + '</div><b class="num">' + p.posts + "</b></div>";
  }).join("");
  return '<article class="card"><div class="kicker"><i style="--c:#ff8a3d"></i>12 · Shapes</div><h2>Native formats shipped</h2><p class="deck">Same week, counted by the shape it shipped in. Colors are format colors. The mark is the channel.</p><div class="fmt-bar">' + bar + '</div><div class="fmt-legend">' + legend + "</div>" + rows + "</article>";
}
function renderReactions(m) {
  const rows = m.platforms.map(function (p) {
    return '<div class="rx"><div class="rx-top"><div class="who" style="display:flex;gap:6px;align-items:center">' + mark(p.id, 14) + "<b>" + esc(p.name) + '</b></div><b class="num">' + comma(p.eng) + '</b></div>' +
      '<div class="rx-bar"><i style="width:' + (p.likes / p.eng * 100) + '%;background:#0f9d72"></i><i style="width:' + (p.comments / p.eng * 100) + '%;background:#1a6fd4"></i><i style="width:' + (p.shares / p.eng * 100) + '%;background:#ff4d6d"></i></div>' +
      '<div class="rx-nums"><span>' + esc(p.like) + " <b>" + comma(p.likes) + "</b></span><span>" + esc(p.comment) + " <b>" + comma(p.comments) + "</b></span><span>" + esc(p.share) + " <b>" + comma(p.shares) + "</b></span></div></div>";
  }).join("");
  return '<article class="card"><div class="kicker"><i style="--c:#ff4d6d"></i>13 · Reactions</div><h2>Likes, comments, shares</h2><p class="deck">Mint, blue, and coral are the three reaction types. Names change with the platform: replies and reposts on X, sends on Instagram.</p>' + rows + "</article>";
}
function renderConnections(m) {
  return '<section class="row conns" aria-label="Channel connection status">' + m.platforms.map(function (p) {
    return '<article class="card conn" style="border-top:3px solid ' + p.color + '"><div class="conn-top">' + mark(p.id, 22) +
      '<div><div class="name">' + esc(p.name) + (p.aka ? " · " + esc(p.aka) : "") + '</div><div class="aka">Placeholder channel</div></div></div>' +
      '<div class="statusline"><span class="ok"><i></i>Mock · healthy</span><span class="tag">No live login</span></div>' +
      "<dl><div><dt>Posts 7d</dt><dd class='num'>" + p.posts + "</dd></div><div><dt>In queue</dt><dd class='num'>" + p.queue + "</dd></div>" +
      "<div><dt>Followers</dt><dd class='num'>" + compact(p.followerEnd) + "</dd></div><div><dt>7-day rate</dt><dd class='num'>" + p.rate.toFixed(1) + "%</dd></div></dl>" +
      '<div class="sync">Sample sync · ' + STAMP + "</div></article>";
  }).join("") + "</section>";
}
function render(m) {
  const ticker = DATA.ticker.concat(DATA.ticker).map(function (t, i) {
    const c = RANK_BG[i % RANK_BG.length];
    return '<span><i style="background:' + c + '"></i>' + esc(t) + "</span>";
  }).join("");
  document.getElementById("app").innerHTML =
    '<header class="mast"><div class="brand"><div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div><div class="eyebrow">Mission control · sample beta</div><h1>The Content Machine</h1><p class="sub">Austin Chen’s AI Content Machine. One sitting of creative work, remade into native posts for YouTube, X, Instagram, Facebook, and TikTok. The point is the following. Every figure on this wall is mock data.</p></div></div>' +
    '<div class="mast-meta"><div class="chip"><b></b>Sample data</div><div class="stamp"><div class="k">Sample stamp</div><strong class="num">' + STAMP + '</strong></div><div class="clockbox"><div class="k"><i class="pulse"></i>Local clock</div><strong class="num js-clock">--:--:--</strong></div></div></header>' +
    '<div class="ticker" aria-hidden="true"><div class="ticker-track">' + ticker + "</div></div>" +
    renderKpis(m) + renderSparks(m) +
    '<section class="row hero">' + renderVolume(m) + renderEr(m) + renderTop(m) + "</section>" +
    '<div class="row">' + renderQueue(m) + "</div>" +
    '<section class="row split">' + renderPipeline(m) + renderHeat() + "</section>" +
    '<section class="row trio">' + renderFollowers(m) + renderFormats(m) + renderReactions(m) + "</section>" +
    renderConnections(m) +
    '<footer class="foot"><span>Sample beta · placeholder channels only · no accounts, handles, or URLs · nothing here is a live post.</span><span class="num">Window 20–26 Nov 2026 · stamp ' + STAMP + "</span></footer>";
}
function tick() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  const clock = hh + ":" + mm + ":" + ss;
  const count = countdown(NEXT_ISO);
  document.querySelectorAll(".js-clock").forEach(function (n) { n.textContent = clock; });
  document.querySelectorAll(".js-count").forEach(function (n) { n.textContent = count; });
}
render(derive());
tick();
setInterval(tick, 1000);
</script>
